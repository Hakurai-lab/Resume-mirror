<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Mirror｜職務経歴書をきれいに</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<!-- ==========================================================
     Resume Mirror v2 (BYOAI)
     ブロック一覧 ※修正時は「BLOCK n」で検索
       BLOCK 1 : 設定・定数・データ
       BLOCK 2 : スタイル
       BLOCK 3 : APIキー設定画面（STEP 0）
       BLOCK 4 : AI呼び出し・エラー文言
       BLOCK 5 : 入力ステップの画面
       BLOCK 6 : 職務経歴書の組み立て・PDF出力
       BLOCK 7 : AI機能（整形・生成・前後比較）
       BLOCK 8 : 画面制御・共通処理
     ========================================================== -->

<style>
/* ============ BLOCK 2: スタイル ============ */
  :root{
    --navy:#1E2761; --ink:#141A3C; --ice:#CADCFC; --ice-soft:#E9F0FD;
    --paper:#FBFBFD; --line:#DDE3F0; --muted:#6B7280; --accent:#2E8B57; --warn:#B23A48;
    --shadow:0 6px 24px rgba(20,26,60,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.75}
  .app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 20px 12px}
  .brand{display:flex;align-items:center;gap:9px;font-family:"Zen Kaku Gothic New";font-weight:900;font-size:17px}
  .brand .mk{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#fff 0 48%,var(--ice) 52% 100%)}
  .steplabel{font-size:12px;color:var(--ice);margin-top:9px;display:flex;justify-content:space-between;align-items:baseline}
  .steplabel b{font-family:"Zen Kaku Gothic New";font-weight:700;color:#fff;font-size:13px}
  .bar{height:4px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:7px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ice),#fff);transition:width .35s}

  main{flex:1;padding:22px 20px 130px}
  .h2{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:22px;line-height:1.35;margin-bottom:4px}
  .lede{font-size:13px;color:var(--muted);margin-bottom:20px}
  .sechead{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:16px;color:var(--navy);
    margin:26px 0 4px;padding-left:10px;border-left:5px solid var(--navy)}
  .sechead:first-of-type{margin-top:6px}
  .secnote{font-size:12.5px;color:var(--muted);margin:0 0 13px 15px}

  label.f{display:block;margin-bottom:15px}
  label.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .req{color:var(--warn);font-size:11px;margin-left:3px}
  input,textarea,select{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:#fff;
    border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--ice-soft)}
  /* BLOCK 2-a: 入力欄は内容にあわせて自動で伸びる */
  textarea{resize:vertical;min-height:170px;overflow:hidden;line-height:1.8}
  textarea.big{min-height:230px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;align-items:end}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
  .count{font-size:11.5px;color:var(--muted);margin-top:5px;text-align:right}
  .count b{color:var(--navy)}

  .card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .cardhead b{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:13px;color:var(--navy)}
  .del{background:none;border:none;color:var(--warn);font-size:12px;font-weight:700;cursor:pointer}
  .addbtn{width:100%;background:var(--ice-soft);color:var(--navy);border:1.5px dashed var(--navy);
    border-radius:12px;padding:13px;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:14px;cursor:pointer;margin-bottom:6px}

  .ai{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--navy);color:#fff;border:none;
    border-radius:10px;padding:10px 15px;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:13px;cursor:pointer}
  .ai.sub{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .ai:disabled{opacity:.5}
  .sp{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .ai.sub .sp{border-color:rgba(30,39,97,.3);border-top-color:var(--navy)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ok{font-size:12px;color:var(--accent);margin-top:7px;font-weight:700}
  .ng{font-size:12px;color:var(--warn);margin-top:7px;line-height:1.6}

  /* BLOCK 2-b: AI整形の前後比較 */
  .cmp{margin-top:10px;border:1.5px solid var(--accent);border-radius:13px;overflow:hidden;background:#F1F8F3}
  .cmp>summary{list-style:none;cursor:pointer;padding:11px 14px;font-family:"Zen Kaku Gothic New";
    font-weight:700;font-size:13px;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
  .cmp>summary::-webkit-details-marker{display:none}
  .cmp>summary::after{content:"＋";font-size:16px}
  .cmp[open]>summary::after{content:"−"}
  .cmpbody{padding:0 14px 14px}
  .cmpbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12.5px;
    white-space:pre-wrap;line-height:1.8;max-height:260px;overflow:auto}
  .cmplbl{font-size:11.5px;font-weight:700;color:var(--muted);margin:9px 0 4px}
  .cmplbl.after{color:var(--accent)}
  .undo{margin-top:10px;background:#fff;color:var(--warn);border:1.5px solid var(--warn);border-radius:9px;
    padding:8px 13px;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:12.5px;cursor:pointer}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:560px;margin:0 auto;display:flex;gap:10px;
    padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:rgba(251,251,253,.94);
    backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .nav button{flex:1;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:15px;border-radius:13px;padding:14px;border:none;cursor:pointer}
  .back{background:#fff;color:var(--navy);border:1.5px solid var(--line)!important;flex:0 0 34%}
  .next{background:var(--navy);color:#fff}
  .next:disabled{opacity:.45}

  details.guide{background:#fff;border:1.5px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
  details.guide>summary{list-style:none;cursor:pointer;padding:15px 17px;font-family:"Zen Kaku Gothic New";
    font-weight:700;font-size:14.5px;color:var(--navy);background:var(--ice-soft);display:flex;justify-content:space-between;align-items:center}
  details.guide>summary::-webkit-details-marker{display:none}
  details.guide>summary::after{content:"＋";font-size:17px}
  details.guide[open]>summary::after{content:"−"}
  .gbody{padding:16px 17px 18px;font-size:13.5px}
  .gstep{display:flex;gap:11px;margin-bottom:15px}
  .gnum{flex:0 0 25px;height:25px;border-radius:50%;background:var(--navy);color:#fff;font-family:"Zen Kaku Gothic New";
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .gtxt b{display:block;font-family:"Zen Kaku Gothic New";font-size:14px;color:var(--navy);margin-bottom:2px}
  .gtxt small{display:block;font-size:12.5px;color:#444;line-height:1.75}
  .gtxt a{color:var(--navy);font-weight:700;word-break:break-all}
  .note{background:var(--ice-soft);border-radius:11px;padding:12px 14px;font-size:12.5px;margin-top:10px;line-height:1.75}
  .note b{font-family:"Zen Kaku Gothic New";color:var(--navy)}
  .safe{border:1.5px solid var(--accent);border-radius:12px;padding:13px 15px;font-size:12.5px;line-height:1.75;background:#F1F8F3;margin-bottom:16px}
  .safe b{font-family:"Zen Kaku Gothic New";color:var(--accent);display:block;margin-bottom:3px}
  .faq{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
  .faq dt{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:13px;color:var(--navy);margin-top:11px}
  .faq dd{font-size:12.5px;color:#444;margin-top:2px;line-height:1.7}

  .doc{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:26px 22px;font-size:13px;line-height:1.85}
  .doc h1{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:20px;color:var(--navy);letter-spacing:.04em;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:6px}
  .doc .meta{font-size:11.5px;color:var(--muted);text-align:right;margin-bottom:4px}
  .doc .who{text-align:right;font-size:12.5px;line-height:1.8;margin-bottom:18px}
  .doc .who .nm{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:15px;color:var(--ink);margin-bottom:2px}
  .doc h2{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:14px;color:var(--navy);margin:18px 0 7px;padding-left:9px;border-left:4px solid var(--ice)}
  .doc .exp{margin-bottom:15px}
  .doc .exp .co{font-weight:700;font-size:13.5px}
  .doc .exp .rl{font-size:12px;color:var(--muted);margin-bottom:3px}
  .doc .kv{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:5px 0;gap:12px}
  .doc .kv .r{color:var(--muted);text-align:right;white-space:nowrap}
  .doc .sk{border-bottom:1px dotted var(--line);padding:7px 0}
  .doc .sk .n{font-weight:700}
  .doc .sk .a{font-size:12.5px;white-space:pre-wrap}
  .doc table.hist{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 8px}
  .doc table.hist th{background:var(--navy);color:#fff;font-weight:700;text-align:left;padding:6px 8px;font-size:11.5px}
  .doc table.hist td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
  .doc table.hist .dur{color:var(--muted);font-size:10.5px}
  .doc p,.doc .ac{white-space:pre-wrap}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .toolbar button{flex:1;min-width:135px;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:13px;
    border-radius:11px;padding:12px;cursor:pointer;border:1.5px solid var(--navy);background:#fff;color:var(--navy)}
  .toolbar button.primary{background:var(--navy);color:#fff}

  /* BLOCK 2-d: 入力順ノート・面接ストーリー */
  .ordernote{background:var(--ice-soft);border-radius:11px;padding:11px 14px;font-size:12.5px;color:var(--navy);margin-bottom:16px;line-height:1.7}
  .slabor{background:linear-gradient(135deg,var(--navy),#2E4A8B);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}
  .slabor .stitle{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:18px;margin-bottom:6px}
  .slabor .stext{font-size:13px;color:var(--ice);line-height:1.8}
  .spartner{background:var(--ice-soft);border-radius:14px;padding:16px;margin-bottom:18px}
  .spartner .stext{font-size:13px;color:var(--ink);line-height:1.85}
  .ssafe{border:1.5px solid var(--accent);background:#F1F8F3;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.7;color:#2b6b47;margin:6px 0 14px}
  .squote{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:16px;color:var(--navy);background:var(--ice-soft);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .lens{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
  .lens:active{transform:scale(.99)}
  .lens .lt{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:15px;color:var(--navy);margin-bottom:6px}
  .lens .ld{font-size:13px;color:#333;line-height:1.8}
  .lens::after{content:"この切り口で語る →";display:block;margin-top:10px;font-size:12px;font-weight:700;color:var(--accent);text-align:right}
  .lens.picked{border-color:var(--accent);border-width:2.5px;background:#F4FBF7}
  .lens.picked::after{content:"✓ この切り口を選びました"}

  /* BLOCK 2-e: 求人要点・チップ・面接シート */
  .digest{background:#fff;border:1.5px solid var(--navy);border-radius:15px;padding:15px;margin:12px 0 6px;box-shadow:var(--shadow)}
  .digest .dgh{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:13.5px;color:var(--navy);margin-bottom:11px}
  .digest textarea{min-height:70px}
  .chips{margin-top:10px}
  .chiplbl{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .chip{display:inline-block;background:var(--ice-soft);color:var(--navy);border:1.5px solid var(--ice);
    border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0;cursor:pointer}
  .chip:active{background:var(--ice)}

  .sheetdoc{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px 18px;margin-top:6px}
  .sheetdoc h1{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:19px;color:var(--navy);
    border-bottom:2px solid var(--navy);padding-bottom:7px;margin-bottom:5px}
  .sheetdoc .smeta{font-size:11.5px;color:var(--muted);text-align:right;margin-bottom:14px}
  .sblock{margin-bottom:18px}
  .sbh{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:14px;color:#fff;background:var(--navy);
    border-radius:9px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .redo{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:7px;padding:4px 10px;
    font-family:"Zen Kaku Gothic New";font-weight:700;font-size:11px;cursor:pointer}
  .sbody{font-size:13.5px;line-height:1.9;padding:0 2px}
  .sline{margin-bottom:2px}
  .turncue{background:#EAF6EF;color:var(--accent);border-radius:8px;padding:8px 11px;margin:8px 0 2px;
    font-weight:700;font-size:12.5px;line-height:1.6}
  .fchk{margin-top:20px;border:2px solid var(--accent);border-radius:15px;padding:16px;background:#F4FBF7}
  .fchkh{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:14px;color:var(--accent);margin-bottom:11px}
  .fchkitem{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.7;margin-bottom:9px;cursor:pointer}
  .fchkitem input{width:auto;flex:0 0 auto;margin-top:4px}

  /* BLOCK 2-f: ステップ移動・優先順位・実績サマリー */
  .stepjump{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  .sj{width:26px;height:26px;border-radius:8px;border:1.5px solid rgba(255,255,255,.35);background:transparent;
    color:#fff;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:12px;cursor:pointer;padding:0}
  .sj.cur{background:#fff;color:var(--navy);border-color:#fff}
  .sj.dis{opacity:.32;cursor:default}
  .lens .rank{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;
    padding:3px 11px;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:11.5px;margin-bottom:7px}
  .lens .ev{margin-top:7px;font-size:11.5px;color:var(--muted)}
  .lens.picked::after{content:"タップで解除"}
  .asum{background:var(--ice-soft);border-radius:12px;padding:13px 15px;margin-bottom:13px}
  .asumh{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:12.5px;color:var(--navy);margin-bottom:7px}
  .asumi{font-size:12.5px;line-height:1.7;color:#333;margin-bottom:3px}
  .asumi b{color:var(--navy);margin-right:7px}
  .tabs{display:flex;gap:8px;margin:14px 0 12px}
  .tabs.prep .tab{font-size:12.5px;padding:11px 6px}
  .tab{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--muted);
    font-family:"Zen Kaku Gothic New";font-weight:700;font-size:14px;cursor:pointer}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .styleswitch{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
  .sw{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--navy);
    font-family:"Zen Kaku Gothic New";font-weight:700;font-size:12px;cursor:pointer}
  .sw.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .usechk{display:flex;align-items:center;gap:7px;cursor:pointer;margin:0}
  .usechk input{width:auto;margin:0}
  .usetag{font-size:11px;color:var(--muted);font-weight:700}
  .ranklist{background:#fff;border:1.5px solid var(--accent);border-radius:14px;padding:14px;margin-top:14px;box-shadow:var(--shadow)}
  .rlh{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:13px;color:var(--accent);margin-bottom:10px}
  .rli{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
  .rli:last-of-type{border-bottom:none}
  .rlno{flex:0 0 24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-family:"Zen Kaku Gothic New";
    font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .rlt{flex:1;font-size:13px;font-weight:700;color:var(--ink);line-height:1.5}
  .rlbtns{display:flex;gap:5px;flex:0 0 auto}
  .rlbtns button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
    color:var(--navy);font-size:13px;cursor:pointer;padding:0}
  .rlbtns button:disabled{opacity:.3;cursor:default}
  .rlbtns .rlx{width:auto;padding:0 10px;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:11.5px;color:var(--warn);border-color:var(--warn)}
  /* BLOCK 2-g: 実績グラフ */
  .chartsvg{width:100%;height:auto;display:block;margin:6px 0}
  .chartempty{background:var(--ice-soft);border-radius:11px;padding:20px;text-align:center;font-size:12.5px;color:var(--muted)}
  .chartblock{margin:14px 0 18px}
  .chartfig{page-break-inside:avoid;break-inside:avoid}
  .charttitle{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:13.5px;color:var(--navy);margin-bottom:4px}
  .chartnote{font-size:11px;color:var(--muted);margin:2px 0 6px}
  .chartsrc{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}
  .charttbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
  .charttbl th,.charttbl td{border:1px solid var(--line);padding:5px 7px;text-align:right}
  .charttbl th:first-child,.charttbl td:first-child{text-align:left;white-space:nowrap}
  .charttbl thead th{background:var(--ice-soft);color:var(--navy);font-weight:700}
  .cdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .serieRow{border-top:1px solid var(--line);padding-top:11px;margin-top:11px}
  .serieHead{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:12px;color:var(--navy);margin-bottom:7px}
  .row3s{display:grid;grid-template-columns:1fr 92px;gap:8px;margin-bottom:8px}
  .chartprev{margin-top:14px;background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:12px}
  .chartprevh{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .chartlg{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}
  .lgrow{display:flex;align-items:center;gap:8px;font-size:11.5px;flex-wrap:wrap}
  .lgdot{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
  .lgdot.bar{opacity:.45}
  .lgname{font-weight:700;color:var(--ink)}
  .lgkind{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
  .lgval{color:var(--navy);font-weight:700;margin-left:auto}
  .clearapp{width:100%;background:#fff;color:var(--warn);border:1.5px solid var(--warn);border-radius:12px;

/* ============ BLOCK 4: AI呼び出し・エラー文言 ============ */
/* 途中打ち切りが起きたら、上限を上げて自動でもう一度だけ試す。
   利用者に「入力を短くしてください」と手作業を求める前に、こちらで吸収する。 */
async function callAI(prompt, maxTokens=3000){
  try{
    return await callAIOnce(prompt, maxTokens);
  }catch(err){
    if(err && err.message==="TRUNCATED"){
      const bigger = Math.min(Math.round(maxTokens*2), 8000);
      if(bigger > maxTokens){
        try{ return await callAIOnce(prompt, bigger); }catch(e2){ throw e2; }
      }
    }
    throw err;
  }
}
async function callAIOnce(prompt, maxTokens=3000){
  if(!S.apiKey) throw new Error("NOKEY");
  const res = await fetch(API_URL,{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":S.apiKey,
      "anthropic-version":ANTHROPIC_VERSION,
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({ model:MODELS[S.model].id, max_tokens:maxTokens,
      messages:[{role:"user",content:prompt}] })
  });
  if(!res.ok){
    const e=new Error("APIERR"); e.status=res.status;
    try{ const j=await res.json(); e.detail=j?.error?.message||""; }catch(_){}
    throw e;
  }
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  /* HTTP 200 でも「途中打ち切り」「拒否」「空」がある。成功として保存しないこと。 */
  if(data.stop_reason==="max_tokens"){ const e=new Error("TRUNCATED"); e.partial=text; throw e; }
  if(data.stop_reason==="refusal"){ throw new Error("REFUSAL"); }
  if(!text){ throw new Error("EMPTY"); }
  return text;
}
function humanError(err){
  if(err.message==="NOKEY") return t("err.nokey");
  if(err.message==="TRUNCATED") return t("err.truncated");
  if(err.message==="REFUSAL") return t("err.refusal");
  if(err.message==="EMPTY") return t("err.empty");
  const s=err.status;
  if(s===401) return t("err.401");
  if(s===400 && /credit|balance/i.test(err.detail||"")) return t("err.credit");
  if(s===429) return t("err.429");
  if(s===529||s===503) return t("err.busy");
  if(s>=500) return t("err.500");
  return t("err.generic");
}

/* AIの返答から JSON 配列だけを頑健に取り出す（余計な文・記号・末尾カンマに耐える）
   ※v12でこの定義が丸ごと消え、STEP7が動かなくなった。消さないこと。 */
function extractJsonArray(text){
  if(!text || typeof text!=="string") return null;
  let t=text.replace(/```json/gi,"").replace(/```/g,"").trim();
  try{ const p=JSON.parse(t); if(Array.isArray(p)) return p; }catch(e){}
  const s=t.indexOf("["), e=t.lastIndexOf("]");
  if(s!==-1 && e!==-1 && e>s){
    const sub=t.slice(s,e+1);
    try{ const p=JSON.parse(sub); if(Array.isArray(p)) return p; }catch(e2){}
    try{ const p=JSON.parse(sub.replace(/,\s*([\]}])/g,"$1")); if(Array.isArray(p)) return p; }catch(e3){}
  }
  return null;
}

/* 短い候補リストだけをAIに返させる（JSONが最も安全に使える形） */
async function askShortList(prompt, max=1500){
  const out = await callAI(prompt, max);
  const arr = extractJsonArray(out);
  if(!Array.isArray(arr)) return null;
  return arr.map(x=> typeof x==="string" ? x.trim() : String(x&&(x.title||x.name||"")).trim())
            .filter(Boolean);
}

/* 優先順位の入れ替え（上へ／下へ） */
function moveRank(pos,dir){
  const r=(Array.isArray(S.story.ranked)?S.story.ranked.slice():[]);
  const to=pos+dir;
  if(to<0||to>=r.length) return;
  const t=r[pos]; r[pos]=r[to]; r[to]=t;
  S.story.ranked=r;
  S.story.chosen=r.length?r[0]:-1;
  render(true); updateNav(); saveNow();
}
function toggleUseAch(id){
  if(!Array.isArray(S.story.useAch)) S.story.useAch=[];
  const i=S.story.useAch.indexOf(id);
  if(i>=0) S.story.useAch.splice(i,1); else S.story.useAch.push(id);
  render(true); saveNow();
}
function pickPattern(i){
  const r=Array.isArray(S.story.ranked)?S.story.ranked.slice():[];
  const at=r.indexOf(i);
  if(at>=0) r.splice(at,1);        /* もう一度タップで解除。順位は繰り上がる */
  else r.push(i);                   /* タップした順に優先順位がつく */
  S.story.ranked=r;
  S.story.chosen = r.length ? r[0] : -1;   /* 1位を主軸として保持（既存処理との互換） */
  render(true); updateNav(); saveNow();     /* 連続で選べるよう、位置を動かさない */
}

/* AIに送る実績テキスト。1件あたりを刻み、根拠になった実績を優先して並べる（打ち切り防止） */
function usedAchv(){ return S.story.achv.filter(a=>a.use!==false && (a.what||"").trim()); }
/* 今回の面接で使う実績（ライブラリ優先。未登録なら旧来の入力にフォールバック） */
function selectedAch(){
  const lib=S.achievements||[];
  if(!lib.length) return null;
  const ids=S.story.useAch||[];
  const picked=ids.map(id=>lib.find(a=>a.id===id)).filter(Boolean);
  return picked.length?picked:lib;      /* 1件も選ばれていなければ全件 */
}
/* AIへ渡す実績テキスト。ライブラリがあればそこから組み立てる（数字の二重入力をなくす） */
function achvText(priorityIdx){
  const lib=selectedAch();
  if(lib){
    const clip=(t)=>{ t=(t||"").trim(); return t.length>ACHV_CHARS ? t.slice(0,ACHV_CHARS)+"…" : t; };
    let ordered=lib;
    if(Array.isArray(priorityIdx) && priorityIdx.length){
      const pri=new Set(priorityIdx.map(n=>Number(n)-1));
      ordered=[...lib.filter((_,i)=>pri.has(i)), ...lib.filter((_,i)=>!pri.has(i))];
    }
    return ordered.map((a,i)=>{
      const ms=(a.metrics||[]).map(metricLine).filter(Boolean);
      return `実績${i+1}：${clip(a.action)||"（未記入）"}`
        + (a.result?`\n結果：${clip(a.result)}`:"")
        + (ms.length?`\n数字：${ms.join(" ／ ")}`:"")
        + (a.jobId?`\n所属：${jobName(a.jobId)}`:"");
    }).join("\n\n") || "（未記入）";
  }
  return achvTextLegacy(priorityIdx);
}
function achvTextLegacy(priorityIdx){
  /* 「今回使う」に絞る。1件も選ばれていなければ、全件を対象にする */
  const anyUsed=S.story.achv.some(a=>a.use!==false && (a.what||"").trim());
  const items=S.story.achv
    .map((a,i)=>({i, a}))
    .filter(x=>(x.a.what||"").trim() && (!anyUsed || x.a.use!==false));
  if(!items.length) return "（未記入）";
  let ordered=items;
  if(Array.isArray(priorityIdx) && priorityIdx.length){
    const pri=new Set(priorityIdx.map(n=>Number(n)-1));   /* 実績番号は1始まり */
    ordered=[...items.filter(x=>pri.has(x.i)), ...items.filter(x=>!pri.has(x.i))];
  }
  const clip=(s)=>{ s=(s||"").trim(); return s.length>ACHV_CHARS ? s.slice(0,ACHV_CHARS)+"…" : s; };
  return ordered.map(x=>`実績${x.i+1}：${clip(x.a.what)}\n数字：${clip(x.a.num)||"（未記入）"}`).join("\n\n");
}

/* AIが返した語り口を検証・正規化する。AI出力は未信頼データとして扱う。 */
function normalizePatterns(arr){
  const lib=selectedAch();
  const maxIdx=lib?lib.length:S.story.achv.length;
  const seen=new Set();
  return (arr||[]).map(p=>{
    if(!p || typeof p!=="object") return null;
    const title=String(p.title==null?"":p.title).trim().slice(0,40);
    const desc =String(p.desc==null ?"":p.desc ).trim().slice(0,200);
    if(!title && !desc) return null;
    /* evidence は 1〜実績件数 の整数だけを残す */
    const evidence = Array.isArray(p.evidence)
      ? [...new Set(p.evidence.map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=maxIdx))]
      : [];
    return {title,desc,evidence};
  }).filter(p=>{
    if(!p) return false;
    const k=p.title||p.desc;
    if(seen.has(k)) return false;   /* 同じ切り口の重複を除く */
    seen.add(k); return true;
  }).slice(0,3);
}

const MAX_CHARTS = 5;
const CHART_COLORS = ["#1E2761","#2E8B57","#B23A48"];
const CHART_SECTIONS = [
  {v:"summary", label:"職務要約"},
  {v:"skills",  label:"スキル・経験"},
  {v:"job",     label:"職務経歴（特定の1社）"},

function newId(pre){ return pre+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function ensureJobIds(){

}
function newChart(){
  return { title:"", place:"jobs", section:"job", jobId:"", position:"after", labels:"", normalize:false, source:"",
    series:[{name:"",type:"bar",values:"",amin:"",amax:"",metricId:""},
            {name:"",type:"line",values:"",amin:"",amax:"",metricId:""},
            {name:"",type:"line",values:"",amin:"",amax:"",metricId:""}] };
}
/* 軸の下限・上限。1つだけ数値を取り出す（空なら null） */
function oneNum(v){
  const t=String(v==null?"":v).replace(/[，,]/g,"").trim();
  if(!t) return null;
  const n=Number(t);
  return isFinite(n) ? n : null;
}
function parseLabels(str){ return String(str==null?"":str).split(/[,、]+/).map(x=>x.trim()).filter(Boolean); }
/* 「1,200」のような桁区切りと、区切り文字としてのカンマは見分けがつかない。
   そこで2通りに解釈し、期間ラベルの個数に合うほうを採用する。 */
function parseNums(str, expect){
  const t=String(str==null?"":str).replace(/[，]/g,",").replace(/[　]/g," ").trim();
  if(!t) return [];
  const toNums=(arr)=>arr.map(x=>x.trim()).filter(Boolean).map(x=>Number(x)).filter(n=>isFinite(n));
  /* 解釈A：カンマも区切りとして扱う（例 "25512, 22678"） */
  const a=toNums(t.split(/[,、;\s]+/));
  /* 解釈B：カンマは桁区切りとして扱う（例 "1,200、1,131"） */
  const b=toNums(t.split(/[、;\s]+/).map(x=>x.replace(/,/g,"")));
  if(expect>0){
    if(a.length===expect && b.length!==expect) return a;
    if(b.length===expect && a.length!==expect) return b;
  }
  return b.length?b:a;
}
/* 実績ライブラリの指標を引く。グラフはこれを参照するだけにして、数字の二重入力をなくす */
function findMetric(id){
  for(const a of (S.achievements||[])){
    for(const m of (a.metrics||[])){ if(m.id===id) return {ach:a, met:m}; }
  }
  return null;
}
function allMetrics(){
  const out=[];
  (S.achievements||[]).forEach(a=>(a.metrics||[]).forEach(m=>{
    if((m.name||"").trim() || (m.values||"").trim()) out.push({ach:a, met:m});
  }));
  return out;
}
function chartData(c){
  /* 期間ラベルは、指定がなければ参照先の指標のものを使う */
  let labelSrc=(c.labels||"").trim();
  if(!labelSrc){
    for(const s of (c.series||[])){
      const f=s.metricId?findMetric(s.metricId):null;
      if(f && (f.met.labels||"").trim()){ labelSrc=f.met.labels; break; }
    }
  }
  const labels=parseLabels(labelSrc);
  const series=(c.series||[]).map(s=>{
    const f=s.metricId?findMetric(s.metricId):null;
    let name=(s.name||"").trim() || (f?(f.met.name||"").trim():"");
    if(TR_RENDER && f) name=trOut(`met_${f.met.id}_n`, name);
    const rawVals=f ? f.met.values : s.values;
    return { name, type:s.type==="line"?"line":"bar",
      vals:parseNums(rawVals, labels.length), amin:oneNum(s.amin), amax:oneNum(s.amax),
      unit:f?(f.met.unit||""):"", linked:!!f };
  }).filter(s=>s.vals.length>0);
  return {labels, series};
}
function fmtNum(n){ return n.toLocaleString("ja-JP"); }

/* 数値をSVGの折れ線・棒グラフに描く。目盛りを揃える指定があれば系列ごとに正規化する。 */
function chartSVG(c){
  const {labels, series}=chartData(c);
  if(!labels.length || !series.length) return `<div class="chartempty">期間ラベルと数値を入力すると、ここにグラフが表示されます。</div>`;
  const n=labels.length;
  const W=640,H=270,L=58,R=24,T=20,B=36, iw=W-L-R, ih=H-T-B;
  const gmax=Math.max(...series.map(s=>Math.max(...s.vals)),1);
  /* 系列ごとの軸範囲。指定があればそれを使い、なければ 0〜最大値 */
  const rangeOf=(s)=>{
    let lo = s.amin!=null ? s.amin : 0;
    let hi = s.amax!=null ? s.amax : (c.normalize ? Math.max(...s.vals,1) : gmax);
    if(!(hi>lo)) hi = lo + 1;
    return {lo,hi};
  };
  const x=(i)=> L + (iw/n)*(i+0.5);
  const y=(v,s)=>{
    const {lo,hi}=rangeOf(s);
    const r=(v-lo)/(hi-lo);
    return T + ih - Math.max(0,Math.min(1,r))*ih;   /* 枠外にはみ出させない */
  };
  const customAxis = series.some(s=>s.amin!=null || s.amax!=null);
  const bars=series.filter(s=>s.type==="bar");
  const slot=iw/n, bw=Math.min(38,(slot*0.62)/Math.max(bars.length,1));

  let g="";
  /* 目盛り線 */
  [0,0.5,1].forEach(t=>{
    const yy=T+ih-ih*t;
    g+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#DDE3F0" stroke-width="1"/>`;
    if(!c.normalize && !customAxis) g+=`<text x="${L-8}" y="${yy+4}" font-size="11" fill="#6B7280" text-anchor="end">${fmtNum(Math.round(gmax*t))}</text>`;
  });
  /* 棒 */
  bars.forEach((s,bi)=>{
    const ci=series.indexOf(s);
    s.vals.forEach((v,i)=>{
      if(i>=n) return;
      const bx=x(i) - (bars.length*bw)/2 + bi*bw;
      const base=y(rangeOf(s).lo, s);
      const by=Math.min(y(v,s), base), bh=Math.max(1, Math.abs(base-y(v,s)));
      g+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${CHART_COLORS[ci%3]}" opacity="0.30" rx="2"/>`;
    });
  });
  /* 折れ線 */
  series.filter(s=>s.type==="line").forEach(s=>{
    const ci=series.indexOf(s);
    const pts=s.vals.slice(0,n).map((v,i)=>`${x(i).toFixed(1)},${y(v,s).toFixed(1)}`).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${CHART_COLORS[ci%3]}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s.vals.slice(0,n).forEach((v,i)=>{
      g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v,s).toFixed(1)}" r="4" fill="#fff" stroke="${CHART_COLORS[ci%3]}" stroke-width="2.5"/>`;
    });
  });
  /* 期間ラベル */
  labels.forEach((lb,i)=>{
    g+=`<text x="${x(i).toFixed(1)}" y="${T+ih+20}" font-size="12" fill="#141A3C" text-anchor="middle">${esc(lb)}</text>`;
  });
  return `<svg class="chartsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${g}</svg>`;
}

/* 凡例はSVGの外に出す。目盛りを揃えると水準が図から読めなくなるため、
   系列名の横に実数の増減（最初→最後）を必ず併記する。 */
function chartLegend(c){
  const {labels, series}=chartData(c);
  if(!labels.length || !series.length) return "";
  return `<div class="chartlg">${series.map((s,ci)=>{
    const v=s.vals.slice(0,labels.length);
    const first=v[0], last=v[v.length-1];
    const range=(v.length>1 && first!=null && last!=null) ? `${fmtNum(first)} → ${fmtNum(last)}` : (first!=null?fmtNum(first):"");
    const kind=s.type==="line"?"折れ線":"棒";
    const ax=(s.amin!=null||s.amax!=null)
      ? `<span class="lgax">軸 ${s.amin!=null?fmtNum(s.amin):"0"}〜${s.amax!=null?fmtNum(s.amax):"自動"}</span>` : "";
    return `<div class="lgrow">
      <span class="lgdot ${s.type==="bar"?"bar":""}" style="background:${CHART_COLORS[ci%3]}"></span>
      <span class="lgname">${esc(s.name||`系列${ci+1}`)}</span>
      <span class="lgkind">${kind}</span>${ax}
      <span class="lgval">${esc(range)}</span>
    </div>`;}).join("")}</div>`;
}

/* グラフの下に、実数のデータ表を必ず添える（見た目だけで判断させないため） */
function chartTable(c){
  const {labels, series}=chartData(c);
  if(!labels.length || !series.length) return "";
  return `<table class="charttbl"><thead><tr><th></th>${labels.map(l=>`<th>${esc(l)}</th>`).join("")}</tr></thead>
    <tbody>${series.map((s,ci)=>`<tr><td><span class="cdot" style="background:${CHART_COLORS[ci%3]}"></span>${esc(s.name||`系列${ci+1}`)}</td>
      ${labels.map((_,i)=>`<td>${s.vals[i]!=null?fmtNum(s.vals[i]):"—"}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

/* 翻訳版の書類を描いている間だけ true。グラフの文言も翻訳に差し替えるために使う */
let TR_RENDER = false;
function withTrRender(fn){ TR_RENDER=true; try{ return fn(); } finally { TR_RENDER=false; } }
function chartText(c, key, fallback){
  if(!TR_RENDER) return fallback;
  const i=(S.charts||[]).indexOf(c);
  return i<0 ? fallback : trOut(`chart${i}_${key}`, fallback);
}
function chartBlockHTML(c){
  const {labels, series}=chartData(c);
  if(!labels.length || !series.length) return "";
  const en = TR_RENDER && S.lang.target==="en";
  const title=chartText(c,"t",c.title), src=chartText(c,"s",c.source);
  return `<div class="chartblock">
    <div class="chartfig">
      ${title?`<div class="charttitle">${esc(title)}</div>`:""}
      ${chartLegend(c)}
      ${chartSVG(c)}
    </div>
    ${c.normalize?`<div class="chartnote">${en?"Note: each series is scaled to its own axis (the figures differ in magnitude). See the ranges above and the table below for actual values.":"※系列ごとに目盛りを揃えています（桁が違うため）。実数は上の増減と下の表をご覧ください。"}</div>`:""}
    ${chartTable(c)}
    ${src?`<div class="chartsrc">${esc(src)}</div>`:""}
  </div>`;
}
/* 指定した位置（セクション・上下・職歴）に一致するグラフだけを差し込む */
function chartsAt(section, position, jobId){
  return (S.charts||[]).filter(c=>{
    const sec=c.section||"job";
    const pos=c.position||"after";
    if(sec!==section) return false;
    if(pos!==position) return false;
    if(section==="job") return jobId && c.jobId===jobId;
    return true;
  }).map(chartBlockHTML).join("");
}

function linkChartToLibrary(i){
  const c=S.charts[i]; if(!c) return;
  const mets=allMetrics();
  if(!mets.length){ alert(t("chart.link.nomets")); return; }
  let hit=0;
  (c.series||[]).forEach(sr=>{
    if(sr.metricId) return;
    const nm=(sr.name||"").trim();
    if(!nm) return;
    const f=mets.find(x=>(x.met.name||"").trim()===nm);
    if(f){ sr.metricId=f.met.id; sr.values=""; hit++; }
  });
  if(!hit){ alert(t("chart.link.alert")); return; }
  render(true); saveNow();
}

function newMetric(){

/* ===== BLOCK 0d: Phase0 データ基盤ヘルパー =====
   新エンティティは UUID。既存 id（newId 形式）は据え置き（参照を壊さないため）。 */
function uuid(){ return (typeof crypto!=="undefined" && crypto.randomUUID) ? crypto.randomUUID() : newId("id"); }
function nowISO(){ return new Date().toISOString(); }
function newWorkLog(jobId){
  return { id:uuid(), createdAt:nowISO(), updatedAt:nowISO(), version:1,
    jobId:jobId||null, title:"", status:"draft",

    actions:"", result:"", metrics:[],
    factConfirmed:false, factConfirmedAt:null,
    visibility:"private", aiProcessingAllowed:false, aiConsentAt:null,
    promotedAchievementIds:[], tags:[], notes:"", aiReview:null, archivedAt:null };
}
/* 保存前ゲート：不整合な state はそもそも書かない、を保つための検証。 */
function validateState(st){
  const errs=[];
  if(!st || typeof st!=="object") return { ok:false, errors:["state is not an object"] };
  ["profile","settings","meta","story","lang"].forEach(k=>{ if(st[k]!==undefined && (typeof st[k]!=="object"||st[k]===null)) errs.push(k+" must be object"); });
  ["skills","certs","jobs","achievements","charts","workLogs","applications","documents"].forEach(k=>{ if(st[k]!==undefined && !Array.isArray(st[k])) errs.push(k+" must be array"); });
  const dup=(arr,name)=>{ if(!Array.isArray(arr)) return; const seen=new Set(); arr.forEach(x=>{ const id=x&&x.id; if(id==null) return; if(typeof id!=="string"||!id){ errs.push(name+" invalid id"); return; } if(seen.has(id)) errs.push(name+" dup id "+id); else seen.add(id); }); };
  dup(st.jobs,"jobs"); dup(st.achievements,"achievements"); dup(st.workLogs,"workLogs");
  if(st.ui!=="ja" && st.ui!=="en") errs.push("ui invalid");
  return { ok:errs.length===0, errors:errs };
}

      <button onclick="location.reload()">${en?"Retry":"再試行する"}</button>

/* 移行前のデータを、別の場所に丸ごと控えておく（取り込みで壊れても戻せるように） */
function backupOnce(){
  try{
    if(localStorage.getItem(BACKUP_KEY)) return;      /* 一度だけ */
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) localStorage.setItem(BACKUP_KEY, JSON.stringify({ savedAt:new Date().toISOString(), raw }));
  }catch(e){}
}
function hasBackup(){ try{ return !!localStorage.getItem(BACKUP_KEY); }catch(e){ return false; } }
function restoreBackup(){
  try{
    const b=JSON.parse(localStorage.getItem(BACKUP_KEY)||"null");
    if(!b || !b.raw){ alert(t("lib.bk.none")); return; }
    if(!confirm(t("lib.bk.confirm.a")+"\n\n"+t("lib.bk.confirm.b"))) return;
    localStorage.setItem(STORE_KEY, b.raw);
    location.reload();
  }catch(e){ alert(t("lib.bk.fail")); }
}

function buildCandidates(){
  const out=[];
  (S.jobs||[]).forEach(j=>{
    const txt=(j.achv||"").trim();
    if(txt) out.push({ key:"job:"+j.id, from:t("lib.from.job")+(j.company||t("lib.co.unset")), jobId:j.id, text:txt });
  });
  (S.skills||[]).forEach((s,si)=>{
    const txt=(s.achv||"").trim();
    if(txt) out.push({ key:"skill:"+si, from:t("lib.from.skill")+(s.name||t("lib.name.unset")), jobId:"", text:txt });
  });
  ((S.story&&S.story.achv)||[]).forEach((a,ai)=>{
    const txt=(a.what||"").trim();
    if(txt) out.push({ key:"story:"+ai, from:t("lib.from.story"), jobId:"", text:txt, num:(a.num||"").trim() });
  });
  (S.charts||[]).forEach((c,ci)=>{
    const {labels,series}=chartData(c);
    if(!labels.length || !series.length) return;
    out.push({ key:"chart:"+ci, from:t("lib.from.chart")+(c.title||t("lib.title.unset2")), jobId:(c.section==="job"?c.jobId:"")||"",
      text:"", chart:c, chartIdx:ci });

  const done=new Set((S.importSkipped||[]).concat((S.achievements||[]).map(a=>a.source&&a.source.from).filter(Boolean)));
  return out.filter(x=>!done.has(x.key));

function importCandidate(key){
  const c=buildCandidates().find(x=>x.key===key);

  if(c.chart){
    a.title=c.chart.title||"グラフから取り込み";
    const src=S.charts[c.chartIdx];
    a.metrics=[];
    (src.series||[]).forEach((sr,si)=>{
      const vals=(sr.values||"").trim();
      if(!vals && !sr.metricId) return;
      if(sr.metricId) return;                       /* すでに連動済みの系列は触らない */
      const met={ id:newId("met"), name:(sr.name||"").trim(), unit:"",
        labels:(src.labels||"").trim(), values:vals, source:src.source||"" };
      a.metrics.push(met);
      /* 元のグラフを、いま作った指標へ向け直す＝数字の正本がライブラリ側になる */
      src.series[si].metricId=met.id;
      src.series[si].values="";
    });
    a.usage.chart=true;
  }else{
    a.action=c.text;
    a.title=(c.text||"").replace(/\s+/g," ").slice(0,20);
    if(c.num){
      a.metrics=[{ id:newId("met"), name:"", unit:"", labels:"", values:c.num, source:"" }];
    }
  }
  a.open=false;
  S.achievements.push(a);
  render(true); saveNow();
}

/* ============ BLOCK 14: 翻訳と再翻訳（第5段階） ============
   考え方：
   ・原文の言語を「正本」とする。翻訳を直しても原文は自動で変えない。
   ・確認は「原文 ／ 翻訳 ／ 作成言語に再翻訳」を並べて、母国語だけで判断できるようにする。
   ・APIは3〜5ブロックまとめて呼ぶが、保存はブロック単位。1つ失敗しても他は残る。
   ・原文が変わったら、その翻訳は「古い」と表示する（消さない）。 */

const TR_BATCH = 4;                     /* 1回のAI呼び出しで扱うブロック数 */
const LANG_LABEL = { ja:"日本語", en:"English" };
function otherLang(l){ return l==="ja" ? "en" : "ja"; }

/* 翻訳対象のブロックを、いまの内容から組み立てる。
   scope: "doc"＝職務経歴書 ／ "sheet"＝面接シート */
function trBlocks(scope){
  if(scope==="sheet"){
    const out=[]; const sh=S.story.sheet||{};
    const jd=S.story.jd||{};
    if((jd.company||"").trim()) out.push({id:"jd_company", label:"応募先の会社名", text:jd.company.trim()});
    if((jd.position||"").trim()) out.push({id:"jd_position", label:"応募ポジション", text:jd.position.trim()});
    SHEET_BLOCKS.forEach(b=>{
      const t=String(sh[b.key]||"").trim();
      if(t) out.push({id:`sheet_${b.key}`, label:b.label, text:t});
    });
    return out;
  }
  const out=[];
  const push=(id,label,text)=>{ const t=String(text==null?"":text).trim(); if(t) out.push({id,label,text:t}); };
  push("summary","職務要約",S.summary);
  (S.skills||[]).forEach((s,i)=>{
    push(`skill${i}_n`,`スキル名：${s.name||i+1}`,s.name);
    push(`skill${i}_a`,`スキルの実績：${s.name||i+1}`,s.achv);
  });
  (S.certs||[]).forEach((c,i)=>{ push(`cert${i}_n`,`資格名：${c.name||i+1}`,c.name); });
  (S.jobs||[]).forEach(j=>{
    push(`job_${j.id}_r`,`役職：${j.company||""}`,j.role);
    push(`job_${j.id}_a`,`職歴の実績：${j.company||""}`,j.achv);
  });
  (S.achievements||[]).forEach(a=>{
    const nm=a.title||"実績";
    push(`ach_${a.id}_a`,`${nm}（実行したこと）`,a.action);
    push(`ach_${a.id}_r`,`${nm}（結果）`,a.result);
    (a.metrics||[]).forEach(m=>{ push(`met_${m.id}_n`,`指標名：${m.name||""}`,m.name); });
  });
  (S.charts||[]).forEach((c,i)=>{
    push(`chart${i}_t`,`グラフのタイトル`,c.title);
    push(`chart${i}_s`,`グラフの出典`,c.source);
  });
  push("pr","自己PR",S.pr);
  return out;
}
function hashText(t){
  const s=String(t==null?"":t); let h=0;
  for(let i=0;i<s.length;i++) h=((h*31)+s.charCodeAt(i))|0;
  return String(h);
}
function trRec(id){ return (S.tr||{})[id] || null; }
/* 翻訳文を引く。無ければ原文をそのまま返す（未翻訳でも書類は成立させる） */
function trOut(id, fallback){
  const r=trRec(id);
  return (r && r.out) ? r.out : fallback;
}
function trStale(b){
  const r=trRec(b.id);
  return !!(r && r.out && r.hash!==hashText(b.text));
}
function trStats(scope){
  const bs=trBlocks(scope);
  let done=0, stale=0, ok=0, back=0;
  bs.forEach(b=>{
    const r=trRec(b.id);
    if(r && r.out){ done++; if(r.back) back++; if(r.ok) ok++; if(r.hash!==hashText(b.text)) stale++; }
  });
  return { total:bs.length, done, stale, ok, back };
}

/* ---- AIとのやりとり（IDタグ付きプレーンテキスト。JSONは使わない） ---- */
function packBlocks(items){
  return items.map(x=>`[[BLOCK:${x.id}]]\n${x.text}\n[[/BLOCK]]`).join("\n\n");
}
function unpackBlocks(text){
  const map={};
  const re=/\[\[BLOCK:([^\]\n]+)\]\]([\s\S]*?)\[\[\/BLOCK\]\]/g;
  let m;
  while((m=re.exec(String(text||"")))){ map[m[1].trim()]=m[2].trim(); }
  return map;
}

async function runTranslate(mode, only, scope){
  /* mode: "fwd"（原文→翻訳）／"back"（翻訳→原文の言語） */
  const zone=document.getElementById("trMsg");
  const from = mode==="fwd" ? S.lang.doc : S.lang.target;
  const to   = mode==="fwd" ? S.lang.target : S.lang.doc;
  const all=trBlocks(scope);
  let targets;
  if(Array.isArray(only) && only.length){
    targets=all.filter(b=>only.includes(b.id));
  }else if(mode==="fwd"){
    targets=all.filter(b=>{ const r=trRec(b.id); return !r || !r.out || r.hash!==hashText(b.text); });
  }else{
    targets=all.filter(b=>{ const r=trRec(b.id); return r && r.out && !r.back; });
  }
  if(!targets.length){
    if(zone) zone.innerHTML=`<div class="ok">${mode==="fwd"?t("tr.none.fwd"):t("tr.none.back")}</div>`;
    return;
  }
  const fail=[];
  for(let i=0;i<targets.length;i+=TR_BATCH){
    const group=targets.slice(i,i+TR_BATCH);
    if(zone) zone.innerHTML=`<div class="ok">${mode==="fwd"?t("tr.prog.fwd"):t("tr.prog.back")}…（${Math.min(i+TR_BATCH,targets.length)} / ${targets.length}）</div>`;
    const items = group.map(b=>{
      if(mode==="fwd") return { id:b.id, text:b.text };
      const r=trRec(b.id);
      return { id:b.id, text:(r&&r.out)||"" };
    });
    const prompt = mode==="fwd"
      ? `次の各ブロックを、応募書類（履歴書・職務経歴書）として自然な${LANG_LABEL[to]}に翻訳してください。

厳守：
・意味を変えない。情報を足さない。落とさない。
・数字・単位はそのまま保つ。
・会社名・製品名・人名などの固有名詞は、原則そのまま残す。ただし「株式会社◯◯」のような法人格の表記だけは、その言語の慣用（例：◯◯ Co., Ltd.）に合わせてよい。
・直訳ではなく、応募書類として自然な表現にする。
・各ブロックの先頭と末尾にある区切り行は、記号もIDも一字一句そのまま残す。
・出力はブロックのみ。前置き・解説は書かない。

${packBlocks(items)}`
      : `次の各ブロックを、意味の検算のために${LANG_LABEL[to]}へ再翻訳してください。

厳守：
・意訳しない。元の文が何を言っているかが分かるよう、できるだけ忠実に訳す。
・情報を足さない。落とさない。整えない。
・各ブロックの先頭と末尾にある区切り行は、記号もIDも一字一句そのまま残す。
・出力はブロックのみ。前置き・解説は書かない。

${packBlocks(items)}`;
    const apply=(id, v, srcText)=>{
      S.tr[id]=S.tr[id]||{};
      if(mode==="fwd"){
        S.tr[id].out=v; S.tr[id].hash=hashText(srcText);
        S.tr[id].back=""; S.tr[id].ok=false;   /* 原文が変わったので再翻訳はやり直し */
      }else{
        S.tr[id].back=v;
      }
    };
    let missing=[];
    try{
      const map=unpackBlocks(await callAI(prompt, 3000));
      group.forEach(b=>{
        const v=map[b.id];
        if(v) apply(b.id, v, b.text); else missing.push(b);
      });
    }catch(err){
      missing=group.slice();
    }
    /* まとめて取れなかった分は、1件ずつ取り直す（区切り記号の崩れに強い） */
    for(const b of missing){
      if(zone) zone.innerHTML=`<div class="ok">${esc(b.label)} ${mode==="fwd"?t("tr.oneby.fwd"):t("tr.oneby.back")}</div>`;
      const one = (mode==="fwd")
        ? `次の文章を、応募書類（履歴書・職務経歴書）として自然な${LANG_LABEL[to]}に翻訳してください。\n\n厳守：意味を変えない。情報を足さない・落とさない。数字と固有名詞はそのまま。出力は訳文の本文のみ。前置き・解説・記号を書かない。\n\n${(mode==="fwd"?b.text:"")}`
        : `次の文章を、意味の検算のために${LANG_LABEL[to]}へ忠実に再翻訳してください。\n\n厳守：意訳しない。情報を足さない・落とさない。出力は訳文の本文のみ。前置き・解説・記号を書かない。\n\n${((trRec(b.id)||{}).out)||""}`;
      try{
        const v=(await callAI(one, 1500)).replace(/\[\[\/?BLOCK[^\]]*\]\]/g,"").trim();
        if(v) apply(b.id, v, b.text); else fail.push(b.label);
      }catch(err){
        fail.push(b.label+"（"+humanError(err)+"）");
      }
      saveNow();
    }
    saveNow();
  }
  render(true);
  const z=document.getElementById("trMsg");
  if(z) z.innerHTML = fail.length
    ? `<div class="ng">${t("tr.partial")}<br>${esc(fail.join(" ／ "))}</div>`
    : `<div class="ok">✓ ${mode==="fwd"?t("tr.act.fwd"):t("tr.act.back")}${t("tr.done")}</div>`;
}

/* ---- 原文と再翻訳の差分 ----
   人が全文を読み比べる負担を減らすため、違う箇所だけを色で示す。
   赤＝原文にあるのに再翻訳に無い（訳で落ちた可能性）
   青＝再翻訳にあるのに原文に無い（訳で足された可能性） */
const DIFF_MAX = 1200;              /* 長すぎる文章は比較を打ち切る */
function diffSeq(a, b){
  const n=a.length, m=b.length;
  if(n>DIFF_MAX || m>DIFF_MAX) return null;
  /* 最長共通部分列（後ろから埋める） */
  const dp=new Uint16Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--){
    for(let j=m-1;j>=0;j--){
      dp[i*(m+1)+j] = (a[i]===b[j])
        ? dp[(i+1)*(m+1)+(j+1)]+1
        : Math.max(dp[(i+1)*(m+1)+j], dp[i*(m+1)+(j+1)]);
    }
  }
  const out=[];
  const push=(t,ch)=>{ const last=out[out.length-1];
    if(last && last.t===t) last.s+=ch; else out.push({t,s:ch}); };
  let i=0,j=0;
  while(i<n && j<m){
    if(a[i]===b[j]){ push("same",a[i]); i++; j++; }
    else if(dp[(i+1)*(m+1)+j] >= dp[i*(m+1)+(j+1)]){ push("del",a[i]); i++; }
    else { push("ins",b[j]); j++; }
  }
  while(i<n){ push("del",a[i]); i++; }
  while(j<m){ push("ins",b[j]); j++; }
  return out;
}
/* 比較しやすいよう、記号や空白の揺れをならす */
function normForDiff(t){
  return String(t==null?"":t)
    .replace(/[\s\u3000]+/g,"")
    .replace(/[、，]/g,"、").replace(/[。．]/g,"。")
    .replace(/[（(]/g,"（").replace(/[）)]/g,"）");
}
function diffHTML(src, back){
  const a=normForDiff(src), b=normForDiff(back);
  if(!a || !b) return "";
  const d=diffSeq([...a],[...b]);
  if(!d) return `<div class="trnone">文章が長いため、差分の自動比較は省略しました。上の2つを見くらべてください。</div>`;
  let same=0, diff=0;
  d.forEach(x=>{ if(x.t==="same") same+=x.s.length; else diff+=x.s.length; });
  const rate = same+diff ? Math.round(same/(same+diff)*100) : 100;
  const body=d.map(x=> x.t==="same" ? esc(x.s)
    : `<span class="d${x.t}">${esc(x.s)}</span>`).join("");
  return `<div class="difftop">
      <span class="rate ${rate>=95?"good":(rate>=85?"mid":"bad")}">${t("diff.match")} ${rate}%</span>
      <span class="dlg"><i class="ddel"></i>${t("diff.del")}</span>
      <span class="dlg"><i class="dins"></i>${t("diff.ins")}</span>
    </div>
    <div class="diffbox">${body}</div>
    ${rate>=95?`<div class="hint">${t("diff.ok")}</div>`:`<div class="hint">${t("diff.check")}</div>`}`;
}

function trApprove(id){
  S.tr[id]=S.tr[id]||{}; S.tr[id].ok=!S.tr[id].ok;
  render(true); saveNow();
}
function trRedo(id,scope){ runTranslate("fwd",[id],scope); }
function trRedoBack(id,scope){ runTranslate("back",[id],scope); }
function setLangDoc(v){ S.lang.doc=v; if(S.lang.target===v) S.lang.target=otherLang(v); render(); saveNow(); }
function setLangTarget(v){ S.lang.target=v; if(S.lang.doc===v) S.lang.doc=otherLang(v); render(); saveNow(); }

/* ---- 翻訳版の職務経歴書 ---- */
const EN_H = { resume:"Resume", summary:"Professional Summary", skills:"Skills & Experience",
  certs:"Certifications", overview:"Career Overview", work:"Work Experience", about:"About Me" };
const EN_EMP = { "正社員":"Full-time","契約社員":"Contract","派遣社員":"Temporary / Dispatch",
  "業務委託・個人事業主":"Freelance / Contractor","パート・アルバイト":"Part-time","出向":"Secondment","その他":"Other" };
const EN_MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function periodEn(j){
  const f = (j.fromY&&j.fromM) ? `${EN_MON[Number(j.fromM)-1]} ${j.fromY}` : (j.fromY||"");
  const t = j.current ? "Present" : ((j.toY&&j.toM) ? `${EN_MON[Number(j.toM)-1]} ${j.toY}` : (j.toY||""));
  return [f,t].filter(Boolean).join(" – ");
}
function durationEn(j){
  const d=duration(j); if(!d) return "";
  const y=(d.match(/(\d+)年/)||[])[1], m=(d.match(/(\d+)ヶ月/)||[])[1];
  return [y?`${y} yr${y>1?"s":""}`:"", m?`${m} mo${m>1?"s":""}`:""].filter(Boolean).join(" ");
}
function fmtDateEn(iso){
  const d=new Date(iso);
  return `${EN_MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

  const certs=(S.certs||[]).filter(c=>(c.name||"").trim());
  const jobs=(S.jobs||[]).filter(j=>(j.company||"").trim()||(j.achv||"").trim()||achForJob(j.id).length);

  return `<div class="doc">

    <div class="who">

    </div>

    ${S.summary.trim()?`<h2>${H.summary}</h2><p>${esc(trOut("summary",S.summary))}</p>`:""}
    ${chartsAt("summary","after")}
    ${chartsAt("skills","before")}
    ${skills.length?`<h2>${H.skills}</h2>${skills.map((s,i)=>`<div class="sk">
      <div class="n">${esc(trOut(`skill${i}_n`, s.name))}${s.years?`（${esc(s.years)}）`:""}</div>
      ${s.achv?`<div class="a">${esc(trOut(`skill${i}_a`, s.achv))}</div>`:""}</div>`).join("")}`:""}
    ${chartsAt("skills","after")}
    ${certs.length?`<h2>${H.certs}</h2>${certs.map((c,i)=>`<div class="kv"><span>${esc(trOut(`cert${i}_n`, c.name))}</span>
      <span class="r">${esc([c.y?`${c.y}${en?"":"年"}${c.m?(en?"/"+c.m:c.m+"月"):""}`:"",c.expiry||""].filter(Boolean).join(" / "))}</span></div>`).join("")}`:""}
    ${jobs.length?`<h2>${H.overview}</h2>
      <table class="hist"><thead><tr>
        <th>${en?"Period":"期間"}</th><th>${en?"Company":"会社名"}</th><th>${en?"Client":"就業先"}</th><th>${en?"Type":"雇用形態"}</th></tr></thead>
      <tbody>${jobs.map(j=>{const d=dur(j);return `<tr>
        <td>${esc(per(j))}${d?`<br><span class="dur">（${esc(d)}）</span>`:""}</td>
        <td>${esc(co(j)||"—")}</td><td>${esc(cli(j)||"—")}</td><td>${esc(emp(j.employment))}</td></tr>`}).join("")}</tbody></table>`:""}
    ${jobs.length?`<h2>${H.work}</h2>${jobs.map(j=>{const d=dur(j);return `${chartsAt("job","before",j.id)}<div class="exp">

      <div class="rl">${[trOut(`job_${j.id}_r`, j.role), emp(j.employment)].filter(Boolean).map(esc).join("　|　")}</div>
      <div class="rl">${esc(per(j))}${d?`（${esc(d)}）`:""}</div>

    ${chartsAt("pr","before")}
    ${S.pr.trim()?`<h2>${H.about}</h2><p>${esc(trOut("pr",S.pr))}</p>`:""}

/* 面接シートが「どの入力から作られたか」を記録し、入力が変わったら古い状態として知らせる。
   ※消してしまうのではなく、古いと表示する。利用者の成果物を勝手に失わせないため。 */
function storySignature(){
  const jd=S.story.jd||{}, d=jd.digest||{};
  const parts=[jd.company,jd.position,jd.audience,jd.raw,d.role,d.must,d.want,d.culture,
    JSON.stringify((S.story.achv||[]).map(a=>[a.what,a.num])),
    JSON.stringify(S.story.ranked||[]),
    JSON.stringify((S.story.patterns||[]).map(p=>p.title))].join("|");
  let h=0;
  for(let i=0;i<parts.length;i++){ h=((h*31)+parts.charCodeAt(i))|0; }
  return String(h);
}
function sheetIsStale(){
  const sh=S.story.sheet||{};
  if(!Object.keys(sh).length) return false;
  return S.story.sheetSig ? (S.story.sheetSig!==storySignature()) : true;
}
/* maxTokens はブロックごとに設定する。短い出力に大きな上限を与えると、指示を外れて長文化する余地が増えるため。 */
const SHEET_BLOCKS = [
  { key:"policy",   label:"1. 面談での方針",            en:"1. Approach for the Interview",     max:700 },
  { key:"stance",   label:"2. 自分の立ち位置",          en:"2. Where I Stand",                  max:1300 },
  { key:"intro",    label:"3. 簡単な自己紹介",          en:"3. Short Self-Introduction",        max:700 },
  { key:"opening",  label:"4. 入り口の一本",            en:"4. The Opening Story",              max:700 },
  { key:"deepdive", label:"5. 掘られたら話すこと",      en:"5. If They Dig Deeper",             max:2200 },
  { key:"gap",      label:"6. 弱み・ギャップを聞かれたら", en:"6. If Asked About Gaps",            max:900 },
  { key:"questions",label:"7. 相手への質問",            en:"7. Questions for Them",             max:800 },
  { key:"lens",     label:"8. あなたの実績につく名前",    en:"8. What Your Work Is Called",       max:1800 }
];
function sheetLabel(b){ return (S.lang && S.lang.target==="en" && b.en) ? b.en : b.label; }
function blockMax(key){ const b=SHEET_BLOCKS.find(x=>x.key===key); return b&&b.max?b.max:1200; }

function renderSheetText(t){
  return esc(t||"").split("\n").map(line=>{
    const s=line.trim();
    if(!s) return `<div class="sgap"></div>`;
    if(s.startsWith("▶")) return `<div class="turncue">${s}</div>`;
    if(/^【.+】$/.test(s)) return `<div class="kwhead">${s.replace(/^【|】$/g,"")}</div>`;
    if(/^[・･]/.test(s)) return `<div class="kwbul">${s.replace(/^[・･]\s*/,"")}</div>`;
    if(/^[0-9０-９]+[.．)）]/.test(s)) return `<div class="kwbul num">${s}</div>`;
    return `<div class="sline">${line}</div>`;
  }).join("");
}

/* キーワード版は「まとめて1回」だと必ず打ち切られるため、数ブロックずつに分けて作る。
   1つ失敗しても他は残す（失敗の単位を小さくする）。 */
const KEY_CHUNK = 3;
async function buildKeywords(btn){
  const zone=document.getElementById("sheetMsg");
  const sh=S.story.sheet||{};
  const filled=SHEET_BLOCKS.filter(b=>sh[b.key]);
  if(!filled.length){ if(zone) zone.innerHTML=`<div class="ng">${esc(t("sheet.kw.needsheet"))}</div>`; return; }
  setLoading(btn,true,t("ld.creating"));
  const parts=[]; const fail=[];
  for(let i=0;i<filled.length;i+=KEY_CHUNK){
    const group=filled.slice(i,i+KEY_CHUNK);
    const body=group.map(b=>`【${b.label}】\n${(sh[b.key]||"").slice(0,1200)}`).join("\n\n");
    if(zone) zone.innerHTML=`<div class="ok">${t("sheet.kw.progress")}（${Math.min(i+KEY_CHUNK,filled.length)} / ${filled.length}）</div>`;
    try{
      const out=await callAI(`次の面接シートの一部を、面接中にちらっと見るための「キーワード版」に変換してください。

厳守：
・文章にしない。キーワードと短い語句の箇条書きだけにする。1行は20字以内。
・元の文章をそのまま写さない。必ず短く削る。
・各見出しにつき、箇条書きは最大5行まで。
・書かれている事実だけを使う。新しい内容を足さない。数字はそのまま残す。
・元の見出し（【】で囲まれた行）はそのまま残し、その下に箇条書きを置く。
・「▶」で始まる行は、20字以内に短くしてそのまま残す。
・出力は本文のみ。前置き・解説は書かない。

${body}`, 1800);
      parts.push(out);
    }catch(err){
      fail.push(group.map(b=>b.label).join("、"));
      parts.push(group.map(b=>`【${b.label}】\n（作成できませんでした）`).join("\n\n"));
    }
  }
  S.story.sheetKey=parts.join("\n\n");
  S.story.cheatMode="key";
  render(true); saveNow();
  const z=document.getElementById("sheetMsg");
  if(z) z.innerHTML = fail.length
    ? `<div class="ng">${t("sheet.kw.partial.pre")}（${esc(fail.join(" ／ "))}）${t("sheet.kw.partial.suf")}</div>`
    : `<div class="ok">${esc(t("sheet.kw.done"))}</div>`;
}

async function buildSheet(btn, onlyMissing){
  const zone=document.getElementById("sheetMsg");
  const rk=Array.isArray(S.story.ranked)&&S.story.ranked.length ? S.story.ranked : (S.story.chosen>=0?[S.story.chosen]:[]);
  if(!rk.length){ zone.innerHTML=`<div class="ng">${esc(t("sheet.noangle"))}</div>`; return; }
  const prev=Object.assign({}, S.story.sheet||{});
  if(!onlyMissing && Object.keys(prev).length){
    if(!confirm(t("sheet.rebuild.confirm"))) return;
  }
  setLoading(btn,true,t("ld.creating"));
  const next=Object.assign({}, prev);   /* 失敗しても既存は消さない */
  const targets = onlyMissing ? SHEET_BLOCKS.filter(b=>!prev[b.key]) : SHEET_BLOCKS;
  if(!targets.length){ zone.innerHTML=`<div class="ok">${esc(t("sheet.build.nomissing"))}</div>`; setLoading(btn,false); return; }
  let done=0; const fail=[];
  for(const b of targets){
    zone.innerHTML=`<div class="ok">${esc(b.label)}${t("sheet.build.progress")}（${done+fail.length+1} / ${targets.length}）</div>`;
    try{
      next[b.key]=await callAI(blockPrompt(b.key), b.max||1200);
      done++;
      S.story.sheet=Object.assign({}, next);
      const w=document.getElementById("sheetWrap"); if(w) w.innerHTML=sheetHTML();
    }catch(err){ fail.push(b.label+"（"+humanError(err)+"）"); }
    saveNow();
  }
  S.story.sheet=next;
  S.story.sheetSig=storySignature();
  render();
  const z=document.getElementById("sheetMsg");
  if(z){
    z.innerHTML = fail.length
      ? `<div class="ng">${t("sheet.build.partial")}<br>${esc(fail.join(" ／ "))}</div>`
      : `<div class="ok">${esc(t("sheet.build.done"))}</div>`;
  }
}

/* ============ BLOCK 6: 職務経歴書の組み立て・PDF出力 ============ */
function period(j){
  const f=[j.fromY&&`${j.fromY}年`,j.fromM&&`${j.fromM}月`].filter(Boolean).join("");
  const t=j.current?"現在":[j.toY&&`${j.toY}年`,j.toM&&`${j.toM}月`].filter(Boolean).join("");
  return [f,t].filter(Boolean).join("〜");
}
/* 在籍期間を ○年○ヶ月 で算出（開始・終了の年月が揃っているときだけ） */
function duration(j){
  const fy=+j.fromY, fm=+j.fromM;
  if(!fy||!fm) return "";
  let ty,tm;
  if(j.current){ const d=new Date(); ty=d.getFullYear(); tm=d.getMonth()+1; }
  else { ty=+j.toY; tm=+j.toM; if(!ty||!tm) return ""; }
  const months=(ty-fy)*12+(tm-fm)+1;
  if(months<=0) return "";
  const y=Math.floor(months/12), m=months%12;
  return [y?`${y}年`:"", m?`${m}ヶ月`:""].filter(Boolean).join("") || "1ヶ月";
}

/* ============ BLOCK 9: 保存・復元（この端末のブラウザ内のみ） ============ */
const STORE_KEY = "resume_mirror_v1";
let saveTimer=null;
let migrationFailed=false;

/* ===== BLOCK 9b: 保存層（Adapter / Repository） =====
   目的：localStorage 直叩きを1か所に集約し、将来 Supabase へは Adapter 差し替えで
   変更範囲を閉じ込める。UI は localStorage を直接触らない（saveNow / repository 経由）。
   localStorage は同期だが、Supabase 移行時に呼び出し側を変えずに済むよう async で定義。 */
const storageAdapter = {
  async read(){ try{ return localStorage.getItem(STORE_KEY); }catch(e){ return null; } },
  async write(raw){ try{ localStorage.setItem(STORE_KEY, raw); return true; }catch(e){ return false; } },
  async clear(){ try{ localStorage.removeItem(STORE_KEY); return true; }catch(e){ return false; } },
  async getRevision(){ try{ const r=localStorage.getItem(STORE_KEY); if(!r) return -1;
    const d=JSON.parse(r); return (d.meta&&typeof d.meta.revision==="number")?d.meta.revision:0; }catch(e){ return -1; } }
};

/* 複数タブ検出：別タブが保存すると storage イベント／ディスク revision で気づく（非ブロッキング通知） */
let otherTabDetected=false;
function tabConflictNotice(){
  if(otherTabDetected) return; otherTabDetected=true;
  try{
    const en=S.ui==="en";
    const bar=document.createElement("div");
    bar.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#FEF6E7;border-top:1px solid #F4D9A6;color:#7c4a12;font-size:13px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center";

    document.body.appendChild(bar);

}
if(typeof window!=="undefined" && window.addEventListener){
  window.addEventListener("storage", e=>{ if(e && e.key===STORE_KEY) tabConflictNotice(); });

/* Repository：エンティティ操作の唯一の口。id / createdAt は不変、updatedAt / version は Repository が管理。
   永続化は実績ある saveNow に委譲（S を単一の in-memory state として扱う）。 */
const repository = {
  getState(){ return S; },
  async save(){ await saveNow(); return (S.meta&&S.meta.revision)||0; },
  async replaceState(next, opts){
    opts=opts||{};
    const v=validateState(next);
    if(!v.ok) throw new Error("invalid state: "+v.errors.join("; "));
    if(opts.expectedRevision!=null){
      const disk=await storageAdapter.getRevision();
      if(disk>=0 && disk!==opts.expectedRevision){ tabConflictNotice(); throw new Error("revision conflict"); }
    }
    Object.keys(next).forEach(k=>{ S[k]=next[k]; });   /* 参照は保ちつつ内容を置換 */
    await saveNow();
    return (S.meta&&S.meta.revision)||0;
  },
  getEntity(coll,id){ return (S[coll]||[]).find(x=>x&&x.id===id)||null; },
  listEntities(coll){ return (S[coll]||[]).slice(); },
  async addEntity(coll,entity){ if(!Array.isArray(S[coll])) S[coll]=[]; S[coll].push(entity); await saveNow(); return entity; },
  async updateEntity(coll,id,patch){
    const arr=S[coll]||[]; const i=arr.findIndex(x=>x&&x.id===id); if(i<0) return null;
    const cur=arr[i];
    const p=Object.assign({}, patch); delete p.id; delete p.createdAt;   /* 不変フィールド */
    Object.assign(cur, p);
    cur.updatedAt=nowISO(); cur.version=(cur.version||1)+1;              /* Repository が管理 */
    await saveNow(); return cur;
  },
  async deleteEntity(coll,id){ const arr=S[coll]||[]; const i=arr.findIndex(x=>x&&x.id===id); if(i<0) return false; arr.splice(i,1); await saveNow(); return true; }
};

async function saveNow(){
  if(migrationFailed) return;
  try{
    if(!validateState(S).ok) return;                 /* 不整合な state はそもそも書かない(§8.6) */
    const disk=await storageAdapter.getRevision();
    if(disk>=0 && disk>((S.meta&&S.meta.revision)||0)) tabConflictNotice();   /* 別タブが先行 */
    if(!S.meta||typeof S.meta!=="object") S.meta={ createdAt:nowISO(), updatedAt:null, lastExportedAt:null, revision:0 };
    S.meta.revision=(S.meta.revision||0)+1;
    S.meta.updatedAt=nowISO();
    const d=JSON.parse(JSON.stringify(S));
    if(!S.saveKey) d.apiKey="";      /* 既定ではAPIキーを保存しない */
    d.keyVerified=false;             /* 起動時は必ず接続テストからやり直す */
    d._at=Date.now();
    await storageAdapter.write(JSON.stringify(d));
    showSaved(d._at);
  }catch(e){ /* 保存不可（プライベートモード等）でも動作は継続 */ }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,600); }

/* 保存データ・読み込んだファイルを、今の版の形に揃える。
   restore() と importData() の両方から使うため、関数として切り出す。 */
function migrateState(){
    // 旧バージョンで保存された story 形式を新形式へ移行（不足フィールドを補う）
    S.story = Object.assign({ jd:{company:"",position:"",audience:"不明 / 未定",raw:"",digest:null},
      achv:[], patterns:[], chosen:-1, ranked:[], sheet:{}, sheetSig:"", checks:[], sheetTab:"sheet", cheatMode:"full", sheetKey:"" }, S.story||{});
    S.story.jd = Object.assign({company:"",position:"",audience:"不明 / 未定",raw:"",digest:null}, S.story.jd||{});
    if(!Array.isArray(S.story.achv)) S.story.achv=[];
    if(!S.story.achv.length) S.story.achv=[{what:"",num:"",hints:[],use:true},{what:"",num:"",hints:[],use:true}];
    S.story.achv=S.story.achv.map(a=>Object.assign({what:"",num:"",hints:[],use:true},a||{}));
    if(!Array.isArray(S.story.patterns)) S.story.patterns=[];
    if(typeof S.story.chosen!=="number") S.story.chosen=-1;
    if(!Array.isArray(S.story.ranked)) S.story.ranked = (S.story.chosen>=0?[S.story.chosen]:[]);
    if(!Array.isArray(S.story.checks)) S.story.checks=[];
    ensureJobIds();
    S.profile=Object.assign({lastName:"",firstName:"",kana:"",nameEn:"",email:"",tel:""}, S.profile||{});
    S.jobs=(S.jobs||[]).map(j=>Object.assign({companyEn:"",clientEn:""}, j||{}));
    /* 実績ライブラリ（第2段階）。旧データを読み込んだ初回に、控えを取る */
    if(!S.schemaVersion || S.schemaVersion < SCHEMA_VERSION){ backupOnce(); S.schemaVersion=SCHEMA_VERSION; }
    if(!Array.isArray(S.achievements)) S.achievements=[];
    S.achievements=S.achievements.map(a=>{
      const d=Object.assign(newAchievement(), a||{});
      d.usage=Object.assign({resume:true,chart:false}, (a&&a.usage)||{});
      d.source=Object.assign({type:"manual",from:""}, (a&&a.source)||{});
      d.metrics=(Array.isArray(a&&a.metrics)?a.metrics:[]).map(m=>Object.assign(newMetric(), m||{}));
      if(!d.id) d.id=newId("ach");
      if(!Array.isArray(d.sourceWorkLogIds)) d.sourceWorkLogIds=[];
      d.open=false;
      return d;
    });
    /* Phase 0（schema3）：新エンティティと共通メタ。既存データは壊さない。 */
    if(!Array.isArray(S.workLogs)) S.workLogs=[];
    if(!Array.isArray(S.applications)) S.applications=[];
    if(!Array.isArray(S.documents)) S.documents=[];
    (S.skills||[]).forEach(x=>{ if(x && !x.id) x.id=uuid(); });
    (S.certs||[]).forEach(x=>{ if(x && !x.id) x.id=uuid(); });
    if(!S.meta || typeof S.meta!=="object") S.meta={};
    S.meta=Object.assign({ createdAt:null, updatedAt:null, lastExportedAt:null, revision:0 }, S.meta);
    if(!S.meta.createdAt) S.meta.createdAt=nowISO();
    if(!S.settings || typeof S.settings!=="object") S.settings={};
    if(!Array.isArray(S.importSkipped)) S.importSkipped=[];
    if(!["charts","trans"].includes(S.docTab)) S.docTab="preview";
    if(S.ui!=="ja" && S.ui!=="en") S.ui=detectUI();
    S.lang=Object.assign({doc:"ja",target:"en"}, S.lang||{});
    if(!LANG_LABEL[S.lang.doc]) S.lang.doc="ja";
    if(!LANG_LABEL[S.lang.target] || S.lang.target===S.lang.doc) S.lang.target=otherLang(S.lang.doc);
    if(!S.tr || typeof S.tr!=="object") S.tr={};
    if(!Array.isArray(S.charts)) S.charts=[];
    S.charts=S.charts.slice(0,MAX_CHARTS).map(c=>{
      const d=Object.assign(newChart(), c||{});
      /* 旧形式（place: skills/jobs/pr）から新形式（section＋position）へ */
      if(!c || !c.section){
        const old=(c&&c.place)||"jobs";
        d.section = old==="skills" ? "skills" : (old==="pr" ? "pr" : "job");
        d.position = "after";
        if(d.section==="job" && !d.jobId){
          const firstJob=(S.jobs||[]).find(j=>(j.company||"").trim());
          d.jobId = firstJob ? firstJob.id : "";
        }
      }
      if(d.position!=="before") d.position="after";
      d.series=(Array.isArray(c&&c.series)?c.series:[]).slice(0,3);
      while(d.series.length<3) d.series.push({name:"",type:d.series.length?"line":"bar",values:""});
      d.series=d.series.map(x=>Object.assign({name:"",type:"bar",values:"",amin:"",amax:"",metricId:""}, x||{}));
      return d;
    });
    if(typeof S.story.sheetSig!=="string") S.story.sheetSig="";
    if(!["resume","trans"].includes(S.story.sheetTab)) S.story.sheetTab="sheet";
    if(S.story.cheatMode!=="key") S.story.cheatMode="full";
    if(typeof S.story.sheetKey!=="string") S.story.sheetKey="";
    if(S.story.jd.digest && typeof S.story.jd.digest==="object"){
      S.story.jd.digest=Object.assign({role:"",must:"",want:"",culture:""}, S.story.jd.digest);
    }
    if(!S.story.sheet || typeof S.story.sheet!=="object") S.story.sheet={};
}

async function restore(){
  let raw=null;
  try{ raw=await storageAdapter.read(); }catch(e){}
  if(!raw) return;                 /* 新規利用者：既定Sのまま */
  try{
    const d=JSON.parse(raw);
    Object.keys(S).forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; });
    S.keyVerified=false;
    migrateState();
    const v=validateState(S);
    if(!v.ok){ migrationFailed=true; showMigrationError(v.errors); return; }
    if(d._at) showSaved(d._at);
  }catch(e){
    migrationFailed=true; showMigrationError([String((e&&e.message)||e)]);
  }
}
function showSaved(ts){
  lastSavedAt = ts;
  const el=document.getElementById("savedAt"); if(!el) return;
  const d=new Date(ts);
  const hhmm = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  el.textContent = t("saved.pre") + hhmm + t("saved.suf");
}
/* ---- データの書き出し／読み込み ----
   PDFを解析して読み戻すのは高くつき精度も出ないため、最初から読み戻せる形（JSON）で書き出す。
   端末の乗り換え・バックアップ・将来の自動入力の土台を、これ1つで兼ねる。 */
const EXPORT_VERSION = 1;

function exportData(){
  try{
    const d=JSON.parse(JSON.stringify(S));
    d.apiKey=""; d.keyVerified=false;      /* APIキーは絶対に書き出さない */
    const pack={ app:"ResumeMirror", exportVersion:EXPORT_VERSION, savedAt:new Date().toISOString(), data:d };
    const nm=[S.profile.lastName,S.profile.firstName].filter(Boolean).join("")||"職務経歴";
    const stamp=new Date().toISOString().slice(0,10).replace(/-/g,"");
    const blob=new Blob([JSON.stringify(pack,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`ResumeMirror_${nm}_${stamp}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
  }catch(e){ alert(t("io.export.fail")); }
}

function importData(input){
  const f=input && input.files && input.files[0];
  if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const pack=JSON.parse(String(rd.result||""));
      const d = (pack && pack.app==="ResumeMirror" && pack.data) ? pack.data : pack;
      if(!d || typeof d!=="object") throw new Error("形式が違います");
      if(!confirm(t("io.import.c1")+"\n\n"+t("io.import.c2")+"\n\n"+t("io.import.c3"))) { input.value=""; return; }
      const keepKey=S.apiKey, keepSave=S.saveKey, keepAgreed=S.agreed;
      Object.keys(S).forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; });
      S.apiKey=keepKey; S.saveKey=keepSave; S.agreed=keepAgreed||!!S.agreed; S.keyVerified=false;
      migrateState();               /* 古い版のファイルでも、今の形に揃える */
      step=1; render(); window.scrollTo(0,0); saveNow();
      alert(t("io.import.done"));
    }catch(e){
      alert(t("io.import.badfile"));
    }
    input.value="";
  };
  rd.onerror=()=>{ alert(t("io.import.readfail")); input.value=""; };
  rd.readAsText(f);
}

/* ============ BLOCK 8: 画面制御・共通処理 ============ */
const main=document.getElementById("main");
function grow(el){ el.style.height="auto"; el.style.height=(el.scrollHeight+4)+"px"; }
function cnt(id,el){ const e=document.getElementById(id); if(e) e.innerHTML=`<b>${el.value.length}</b> ${t("cnt.suffix")}`; }
function growAll(){
  const suf=t("cnt.suffix");
  main.querySelectorAll("textarea").forEach(ta=>{
    grow(ta);
    const c=ta.parentElement.querySelector(".count");
    if(c) c.innerHTML=`<b>${ta.value.length}</b> ${suf}`;
  });
}
function drawStepJump(){
  const el=document.getElementById("stepJump"); if(!el) return;
  const unlocked = S.agreed && (S.keyVerified || S.aiSkipped);
  el.innerHTML = STEP_KEYS.map((_,i)=>{
    const cur = i===step ? " cur":"";
    if(i===0) return `<button class="sj set${cur}" onclick="jumpStep(0)" title="${esc(stepName(0))}">${esc(t("sj.set.short"))}</button>`;
    const dis = unlocked ? "" : " dis";
    return `<button class="sj${cur}${dis}" ${unlocked?`onclick="jumpStep(${i})"`:"disabled"} title="${esc(stepName(i))}">${i}</button>`;
  }).join("");
}
function jumpStep(i){
  if(i<0 || i>TOTAL-1) return;
  if(i>0 && !(S.agreed && (S.keyVerified || S.aiSkipped))) return;   /* 設定(0)へはいつでも戻れる */
  step=i; render(); window.scrollTo(0,0);
}
/* keepScroll=true のとき、再描画してもスクロール位置を保つ。
   画面を作り直すと一瞬ページ高さが縮み、ブラウザが位置を巻き戻すため。 */
function render(keepScroll){
  const y = keepScroll ? (window.scrollY || window.pageYOffset || 0) : null;
  document.getElementById("stepName").textContent=stepName(step);
  document.getElementById("stepCount").textContent=`STEP ${step} / ${TOTAL-1}`;
  document.getElementById("barFill").style.width=`${((step+1)/TOTAL)*100}%`;
  main.innerHTML=VIEWS[step]();
  growAll(); updateNav(); drawStepJump();
  if(y!==null){
    window.scrollTo(0,y);
    requestAnimationFrame(()=>window.scrollTo(0,y));   /* 高さが戻った後にもう一度合わせる */
  }
}
function updateNav(){
  const back=document.getElementById("backBtn"), next=document.getElementById("nextBtn");
  back.style.visibility = step===0 ? "hidden":"visible";
  back.textContent = t("nav.back");
  if(step===TOTAL-1){ next.style.display="none"; }
  else { next.style.display=""; next.textContent = step===7 ? t("nav.next.prep") : (step===8 ? t("nav.next.sheet") : t("nav.next")); }
  next.disabled = (step===0 && !(S.agreed && (S.keyVerified || S.aiSkipped)));
}
function go(dir){
  if(dir>0 && step>=TOTAL-1) return;
  if(dir>0) step++;
  else if(dir<0 && step>0) step--;
  render(); window.scrollTo(0,0);
}
function setLoading(btn,on,label){
  btn.disabled=on;
  if(!btn.dataset.label) btn.dataset.label=btn.innerHTML;
  btn.innerHTML = on ? `<span class="sp"></span>${label||t("ld.creating")}` : btn.dataset.label;
}
function clearMsg(id){ const el=document.getElementById(id); if(el) el.innerHTML=""; updateNav(); }
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(iso){const d=new Date(iso);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;}
function addItem(k,o){
  if(k==="jobs" && !o.id) o.id=newId("job");
  S[k].push(o); render(); saveNow();
  requestAnimationFrame(()=>{const cards=main.querySelectorAll('.card'); if(cards.length) cards[cards.length-1].scrollIntoView({behavior:'smooth',block:'center'});});
}
function delItem(k,i){S[k].splice(i,1);render();saveNow();}

/* 入力のたびに自動保存（600ms待ってからまとめて書き込む） */
main.addEventListener("input", scheduleSave);
main.addEventListener("change", scheduleSave);
window.addEventListener("beforeunload", saveNow);

(async ()=>{ await restore(); if(!migrationFailed){ applyChrome(); render(); } })();
</script>
